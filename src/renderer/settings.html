<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Actuate Settings</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  label {
    font-size: 13px;
  }
  select, input[type="range"] {
    width: 180px;
  }
  .hint {
    font-size: 11px;
    color: #86868b;
    margin-top: -8px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
  <h1>Actuate</h1>

  <div class="row">
    <label for="enabled">Enabled</label>
    <input type="checkbox" id="enabled">
  </div>

  <div class="row">
    <label for="pack">Switch sound</label>
    <select id="pack"></select>
  </div>

  <div class="row">
    <label for="volume">Volume</label>
    <input type="range" id="volume" min="0" max="1" step="0.01">
  </div>

  <div class="row">
    <label for="launchAtLogin">Launch at login</label>
    <input type="checkbox" id="launchAtLogin">
  </div>

  <div class="hint">Toggle on/off anytime with the global hotkey ⌘/Ctrl+Alt+K.</div>

  <script src="settings.js"></script>
</body>
</html>
